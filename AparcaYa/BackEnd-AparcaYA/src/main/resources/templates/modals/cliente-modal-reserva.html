<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--
    FRAGMENTO: cliente-modal-reserva
    Uso: <div th:replace="~{modals/cliente-modal-reserva :: modal}"></div>
    Abre:  abrirModalReserva()    → modal.style.display = 'flex'
    Cierra: cerrarReservaModal()  → modal.style.display = 'none'

    IDs que lee ClienteD.js:
      #reservaSedeNombre  → nombre de la sede seleccionada
      #vehiculoSelect     → select con vehículos del cliente
      #fechaInicio        → datetime-local inicio
      #fechaFin           → datetime-local fin
      #reservarBtn        → botón confirmar — JS asigna onclick = crearReserva
-->
<body>
<th:block th:fragment="modal">

    <div id="reservaModal"
         style="display:none;position:fixed;inset:0;z-index:1000;
                background:rgba(0,0,0,0.5);
                align-items:center;justify-content:center;padding:1rem;"
         role="dialog"
         aria-modal="true"
         aria-labelledby="reservaModalTitle"
         aria-hidden="true">

        <div class="sede-modal-box" style="max-width:480px;width:100%;">

            <!-- Cabecera -->
            <div style="display:flex;align-items:center;
                        justify-content:space-between;margin-bottom:1.25rem;">
                <h3 id="reservaModalTitle"
                    style="font-size:1.125rem;font-weight:700;color:#4c1d95;margin:0;">
                    📅 Nueva Reserva
                </h3>
                <button type="button"
                        onclick="cerrarReservaModal()"
                        aria-label="Cerrar modal"
                        style="background:none;border:none;cursor:pointer;
                               color:#64748b;padding:0.25rem;">
                    <svg xmlns="http://www.w3.org/2000/svg"
                         style="width:1.25rem;height:1.25rem;"
                         fill="none" viewBox="0 0 24 24"
                         stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- Nombre de la sede — rellena JS en abrirModalReserva() -->
            <div style="background:#f5f3ff;border-radius:0.75rem;
                        padding:1rem;margin-bottom:1.25rem;">
                <p style="font-size:0.85rem;color:#6d28d9;font-weight:600;margin:0;">
                    🅿️ <span id="reservaSedeNombre">—</span>
                </p>
            </div>

            <!-- Vehículo — poblado por cargarVehiculosSelect() en JS -->
            <div class="sede-form-group">
                <label for="vehiculoSelect">Vehículo *</label>
                <select id="vehiculoSelect" required>
                    <option value="">Selecciona un vehículo</option>
                </select>
            </div>

            <!-- Fechas -->
            <div class="sede-form-group">
                <label for="fechaInicio">Fecha y hora de inicio *</label>
                <input type="datetime-local" id="fechaInicio" required
                       aria-label="Fecha y hora de inicio de la reserva"/>
            </div>

            <div class="sede-form-group">
                <label for="fechaFin">Fecha y hora de fin *</label>
                <input type="datetime-local" id="fechaFin" required
                       aria-label="Fecha y hora de fin de la reserva"/>
            </div>

            <!-- Acciones -->
            <div class="sede-modal-action">
                <button type="button"
                        class="sede-btn-secondary"
                        onclick="cerrarReservaModal()">
                    Cancelar
                </button>
                <button type="button"
                        id="reservarBtn"
                        class="cli-btn-confirm">
                    Confirmar Reserva
                </button>
            </div>

        </div>
    </div>

</th:block>
</body>
</html>
