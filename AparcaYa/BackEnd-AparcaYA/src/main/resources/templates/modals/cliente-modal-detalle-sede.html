<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--
    FRAGMENTO: cliente-modal-detalle-sede
    Ruta:  templates/modals/cliente-modal-detalle-sede.html
    Uso:   <div th:replace="~{modals/cliente-modal-detalle-sede :: modal}"></div>
    Abre:  mostrarDetallesSede(sedeId)  → modal.style.display = 'flex'
    Cierra: cerrarModalSede()           → modal.style.display = 'none'
    JS:    ClienteD.js — solo asigna textContent, sin innerHTML
-->
<body>
<th:block th:fragment="modal">

    <div id="modalSede"
         style="display:none;position:fixed;inset:0;z-index:1000;
                background:rgba(0,0,0,0.5);
                align-items:center;justify-content:center;padding:1rem;"
         role="dialog"
         aria-modal="true"
         aria-labelledby="modalSedeTitle"
         aria-hidden="true">

        <div class="sede-modal-box" style="max-width:560px;width:100%;">

            <!-- Cabecera -->
            <div style="display:flex;align-items:center;
                        justify-content:space-between;margin-bottom:1.25rem;">
                <h3 id="modalSedeTitle"
                    style="font-size:1.125rem;font-weight:700;color:#4c1d95;margin:0;">
                    Detalles de Sede
                </h3>
                <button type="button"
                        onclick="cerrarModalSede()"
                        aria-label="Cerrar modal"
                        style="background:none;border:none;cursor:pointer;
                               color:#64748b;padding:0.25rem;">
                    <!-- Lucide: x -->
                    <svg xmlns="http://www.w3.org/2000/svg"
                         style="width:1.25rem;height:1.25rem;"
                         fill="none" viewBox="0 0 24 24"
                         stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- Cuerpo con campos fijos — JS solo asigna textContent -->
            <div id="modalSedeBody">

                <div class="cliente-modal-sede-grid">

                    <!-- Estado -->
                    <div class="cliente-modal-sede-item cliente-modal-sede-full">
                        <div class="cliente-modal-sede-label">Estado</div>
                        <div class="cliente-modal-sede-value">
                            <span id="cli-detalle-estado" class="cli-sede-badge"></span>
                        </div>
                    </div>

                    <!-- Dirección -->
                    <div class="cliente-modal-sede-item cliente-modal-sede-full">
                        <div class="cliente-modal-sede-label">
                            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none"
                                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round"
                                 style="display:inline;vertical-align:middle;margin-right:4px;">
                                <path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"/>
                                <circle cx="12" cy="10" r="3"/>
                            </svg>
                            Dirección
                        </div>
                        <div class="cliente-modal-sede-value" id="cli-detalle-direccion">—</div>
                    </div>

                    <!-- Localidad -->
                    <div class="cliente-modal-sede-item">
                        <div class="cliente-modal-sede-label">
                            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none"
                                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round"
                                 style="display:inline;vertical-align:middle;margin-right:4px;">
                                <path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/>
                                <circle cx="12" cy="10" r="3"/>
                            </svg>
                            Localidad
                        </div>
                        <div class="cliente-modal-sede-value" id="cli-detalle-localidad">—</div>
                    </div>

                    <!-- Barrio -->
                    <div class="cliente-modal-sede-item">
                        <div class="cliente-modal-sede-label">
                            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none"
                                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round"
                                 style="display:inline;vertical-align:middle;margin-right:4px;">
                                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                                <polyline points="9 22 9 12 15 12 15 22"/>
                            </svg>
                            Barrio
                        </div>
                        <div class="cliente-modal-sede-value" id="cli-detalle-barrio">—</div>
                    </div>

                    <!-- Capacidad -->
                    <div class="cliente-modal-sede-item">
                        <div class="cliente-modal-sede-label">
                            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none"
                                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round"
                                 style="display:inline;vertical-align:middle;margin-right:4px;">
                                <path d="M19 17H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2z"/>
                                <circle cx="7.5" cy="17" r="1.5"/><circle cx="16.5" cy="17" r="1.5"/>
                                <path d="M5 9h14M9 9V7a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>
                            </svg>
                            Capacidad
                        </div>
                        <div class="cliente-modal-sede-value">
                            <span id="cli-detalle-capacidad">—</span>
                            <span style="font-size:.8rem;color:#94a3b8;margin-left:3px;">vehículos</span>
                        </div>
                    </div>

                    <!-- Horario -->
                    <div class="cliente-modal-sede-item">
                        <div class="cliente-modal-sede-label">
                            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none"
                                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round"
                                 style="display:inline;vertical-align:middle;margin-right:4px;">
                                <circle cx="12" cy="12" r="10"/>
                                <polyline points="12 6 12 12 16 14"/>
                            </svg>
                            Horario
                        </div>
                        <div class="cliente-modal-sede-value" id="cli-detalle-horario">—</div>
                    </div>

                    <!-- Tarifas Carros -->
                    <div class="cliente-modal-sede-item">
                        <div class="cliente-modal-sede-label">
                            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none"
                                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round"
                                 style="display:inline;vertical-align:middle;margin-right:4px;">
                                <line x1="12" x2="12" y1="2" y2="22"/>
                                <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                            </svg>
                            Tarifa Carro
                        </div>
                        <div class="cliente-modal-sede-value">
                            Plena: $<span id="cli-detalle-tarifa-plena-c">—</span> COP
                            <br>
                            <span style="font-size:.8rem;color:#64748b;">
                                /min: $<span id="cli-detalle-tarifa-minuto-c">—</span> COP
                            </span>
                        </div>
                    </div>

                    <!-- Tarifas Motos -->
                    <div class="cliente-modal-sede-item">
                        <div class="cliente-modal-sede-label">
                            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none"
                                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round"
                                 style="display:inline;vertical-align:middle;margin-right:4px;">
                                <line x1="12" x2="12" y1="2" y2="22"/>
                                <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                            </svg>
                            Tarifa Moto
                        </div>
                        <div class="cliente-modal-sede-value">
                            Plena: $<span id="cli-detalle-tarifa-plena-m">—</span> COP
                            <br>
                            <span style="font-size:.8rem;color:#64748b;">
                                /min: $<span id="cli-detalle-tarifa-minuto-m">—</span> COP
                            </span>
                        </div>
                    </div>

                </div>

                <!-- Acciones -->
                <div class="cliente-modal-sede-actions">
                    <button type="button"
                            id="cli-detalle-btn-reservar"
                            class="cli-btn-confirm">
                        <!-- Lucide: calendar-plus -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none"
                             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round"
                             style="display:inline;vertical-align:middle;margin-right:.35rem;">
                            <path d="M8 2v4M16 2v4"/>
                            <rect width="18" height="18" x="3" y="4" rx="2"/>
                            <path d="M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/>
                        </svg>
                        Reservar aquí
                    </button>
                    <button type="button"
                            onclick="cerrarModalSede()"
                            style="padding:.5rem 1.25rem;border:1px solid #e2e8f0;
                                   border-radius:.5rem;background:#fff;color:#374151;
                                   cursor:pointer;font-size:.875rem;">
                        Cerrar
                    </button>
                </div>

            </div>
        </div>
    </div>

</th:block>
</body>
</html>
