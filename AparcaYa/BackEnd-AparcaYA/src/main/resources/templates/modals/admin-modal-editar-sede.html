<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--
    FRAGMENTO: admin-modal-editar-sede
    Uso en dashboard: <div th:replace="modals/admin-modal-editar-sede :: modal"></div>
    Tipo: DaisyUI <dialog> — API nativa showModal() / close()
    Abre con: document.getElementById('modal_editar_sede').showModal()
    Cierra con: cerrarModalEdicionSede()
-->
<body>
<th:block th:fragment="modal">

    <dialog id="modal_editar_sede"
            class="modal"
            aria-labelledby="modal-sede-title">

        <div class="modal-box w-11/12 max-w-3xl">

            <!-- Encabezado -->
            <div class="flex items-center justify-between mb-6 pb-4 border-b border-gray-200">
                <div class="flex items-center gap-3">
                    <div class="bg-primary/10 p-3 rounded-lg">
                        <svg xmlns="http://www.w3.org/2000/svg"
                             class="h-6 w-6 text-primary"
                             fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2
                                  0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5
                                  10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                        </svg>
                    </div>
                    <div>
                        <h3 id="modal-sede-title"
                            class="font-bold text-2xl text-gray-800">
                            Editar Sede
                        </h3>
                        <p class="text-sm text-gray-500">
                            Actualiza la información de la sede
                        </p>
                    </div>
                </div>

                <button onclick="cerrarModalEdicionSede()"
                        class="btn btn-sm btn-circle btn-ghost"
                        aria-label="Cerrar modal"
                        type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5"
                         fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- Formulario -->
            <form onsubmit="event.preventDefault(); guardarEdicionSede();">
                <input type="hidden" id="edit_sede_id">

                <div class="space-y-4">

                    <!-- Nombre de la sede -->
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-semibold text-gray-700">
                                <span class="text-error">*</span> Nombre de la Sede
                            </span>
                        </label>
                        <input type="text"
                               id="edit_sede_nombre"
                               placeholder="Ej: Sede Norte"
                               class="input input-bordered w-full"
                               required>
                    </div>

                    <!-- Dirección -->
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-semibold text-gray-700">
                                <span class="text-error">*</span> Dirección
                            </span>
                        </label>
                        <input type="text"
                               id="edit_sede_direccion"
                               placeholder="Ej: Calle 123 #45-67"
                               class="input input-bordered w-full"
                               required>
                    </div>

                    <!-- Capacidad y Estado -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="form-control">
                            <label class="label">
                                <span class="label-text font-semibold text-gray-700">
                                    <span class="text-error">*</span> Capacidad
                                </span>
                            </label>
                            <input type="number"
                                   id="edit_sede_capacidad"
                                   placeholder="Ej: 100"
                                   min="1"
                                   class="input input-bordered w-full"
                                   required>
                            <label class="label">
                                <span class="label-text-alt text-gray-500">
                                    Número total de espacios
                                </span>
                            </label>
                        </div>
                        <div class="form-control">
                            <label class="label">
                                <span class="label-text font-semibold text-gray-700">
                                    <span class="text-error">*</span> Estado
                                </span>
                            </label>
                            <select id="edit_sede_estado"
                                    class="select select-bordered w-full"
                                    required>
                                <option value="ACTIVO">Activo</option>
                                <option value="INACTIVO">Inactivo</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Nota informativa -->
                <div class="alert alert-info mt-6 shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                         class="stroke-current shrink-0 w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <span>
                        Los campos con <span class="text-error font-bold">*</span> son obligatorios
                    </span>
                </div>

                <!-- Acciones -->
                <div class="modal-action mt-6 pt-4 border-t border-gray-200">
                    <button type="button"
                            onclick="cerrarModalEdicionSede()"
                            class="btn btn-ghost">
                        Cancelar
                    </button>
                    <button type="submit" class="btn btn-primary">
                        Guardar Cambios
                    </button>
                </div>
            </form>
        </div>

        <!-- Backdrop DaisyUI — clic fuera cierra -->
        <form method="dialog" class="modal-backdrop">
            <button>close</button>
        </form>
    </dialog>

</th:block>
</body>
</html>
