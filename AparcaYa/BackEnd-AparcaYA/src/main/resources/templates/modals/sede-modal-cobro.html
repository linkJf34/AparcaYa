<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--
    FRAGMENTO: sede-modal-cobro
    Ruta:      templates/modals/sede-modal-cobro.html
    Uso:       <div th:replace="modals/sede-modal-cobro :: modal"></div>

    CSS:       /css/modals/sede-modal-dinamico.css
    Abre:   abrirModalCobro(registroId)
    Cierra: cerrarModalCobro()
    Lógica: SedeD.js — SIN CAMBIOS
-->
<body>
<th:block th:fragment="modal">

    <div id="cobroModal"
         class="sede-modal-dinamico"
         role="dialog"
         aria-modal="true"
         aria-labelledby="cobroModalTitulo"
         aria-hidden="true">

        <div class="sede-modal-dinamico-content sede-modal-dinamico-content--cobro">

            <!-- HEADER -->
            <div class="sede-modal-dinamico-header">
                <div style="display:flex;align-items:center;gap:.625rem;">
                    <!-- Icono header: banknote -->
                    <div style="width:34px;height:34px;border-radius:.5rem;
                                background:rgba(255,255,255,.15);
                                display:flex;align-items:center;justify-content:center;
                                flex-shrink:0;">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                             viewBox="0 0 24 24" stroke="white"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                             style="width:18px;height:18px;">
                            <rect width="20" height="12" x="2" y="6" rx="2"/>
                            <circle cx="12" cy="12" r="2"/>
                            <path d="M6 12h.01M18 12h.01"/>
                        </svg>
                    </div>
                    <div>
                        <h2 id="cobroModalTitulo" style="margin:0;font-size:1rem;font-weight:800;color:white;">
                            Procesar Cobro
                        </h2>
                        <p style="margin:0;font-size:.73rem;color:rgba(255,255,255,.75);font-weight:500;">
                            Seleccioná la tarifa y el método de pago
                        </p>
                    </div>
                </div>
                <button type="button"
                        class="sede-modal-dinamico-close"
                        onclick="cerrarModalCobro()"
                        aria-label="Cerrar modal">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                         viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6 6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- BODY -->
            <div class="sede-modal-dinamico-body">

                <!-- Tarjeta de datos -->
                <div class="sede-modal-dinamico-card">

                    <div class="sede-modal-cobro-row">
                        <strong>
                            <!-- Lucide: user -->
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                                 viewBox="0 0 24 24" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                 style="width:13px;height:13px;display:inline;vertical-align:middle;margin-right:.25rem;color:#0d9488;">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                            Cliente:
                        </strong>
                        <span id="cobroCliente">—</span>
                    </div>

                    <div class="sede-modal-cobro-row">
                        <strong>
                            <!-- Lucide: square-parking -->
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                                 viewBox="0 0 24 24" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                 style="width:13px;height:13px;display:inline;vertical-align:middle;margin-right:.25rem;color:#0d9488;">
                                <rect width="18" height="18" x="3" y="3" rx="2"/>
                                <path d="M9 17V7h4a3 3 0 0 1 0 6H9"/>
                            </svg>
                            Placa:
                        </strong>
                        <span id="cobroPlaca"
                              style="font-weight:700;color:#0f766e;
                                     font-family:monospace;letter-spacing:.08em;font-size:1rem;">—</span>
                    </div>

                    <div class="sede-modal-cobro-row">
                        <strong>
                            <!-- Lucide: timer -->
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                                 viewBox="0 0 24 24" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                 style="width:13px;height:13px;display:inline;vertical-align:middle;margin-right:.25rem;color:#0d9488;">
                                <line x1="10" x2="14" y1="2" y2="2"/>
                                <line x1="12" x2="15" y1="14" y2="11"/>
                                <circle cx="12" cy="14" r="8"/>
                            </svg>
                            Tiempo total:
                        </strong>
                        <span id="cobroTiempo"
                              style="font-family:'Courier New',monospace;
                                     font-weight:700;color:#0f766e;">—</span>
                    </div>

                    <!-- Total — actualizado por JS -->
                    <div class="sede-modal-cobro-total">
                        <strong>
                            <!-- Lucide: circle-dollar-sign -->
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                                 viewBox="0 0 24 24" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                 style="width:14px;height:14px;display:inline;vertical-align:middle;margin-right:.3rem;color:#059669;">
                                <circle cx="12" cy="12" r="10"/>
                                <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/>
                                <path d="M12 18V6"/>
                            </svg>
                            Total a cobrar:
                        </strong>
                        <span class="sede-modal-cobro-precio">
                            $<span id="cobroPrecio">0</span>
                        </span>
                    </div>

                </div>

                <!-- JS inyecta opciones de tarifa aquí — sin cambios -->
                <div id="tarifaSelectorContainer"></div>

                <!-- Método de pago -->
                <div class="sede-modal-cobro-metodo">
                    <label for="metodoPago" class="sede-modal-cobro-label">
                        <!-- Lucide: credit-card -->
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                             viewBox="0 0 24 24" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                             style="width:14px;height:14px;display:inline;vertical-align:middle;margin-right:.3rem;color:#0d9488;">
                            <rect width="20" height="14" x="2" y="5" rx="2"/>
                            <line x1="2" x2="22" y1="10" y2="10"/>
                        </svg>
                        Método de Pago
                    </label>
                    <select id="metodoPago" class="sede-modal-cobro-select">
                        <option value="EFECTIVO">💵 Efectivo</option>
                        <option value="TARJETA">💳 Tarjeta</option>
                        <option value="TRANSFERENCIA">📱 Transferencia</option>
                    </select>
                </div>

                <!-- Acciones — onclick idénticos al original -->
                <div class="sede-modal-dinamico-actions">
                    <button type="button"
                            class="sede-btn-secondary"
                            onclick="cerrarModalCobro()">
                        <!-- Lucide: x -->
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"
                             stroke-linecap="round" stroke-linejoin="round"
                             style="width:14px;height:14px;">
                            <path d="M18 6 6 18M6 6l12 12"/>
                        </svg>
                        Cancelar
                    </button>
                    <button type="button"
                            class="sede-btn-primary"
                            onclick="procesarCobro()">
                        <!-- Lucide: check-circle -->
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round"
                             style="width:15px;height:15px;">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                            <polyline points="22 4 12 14.01 9 11.01"/>
                        </svg>
                        Confirmar Cobro
                    </button>
                </div>

            </div>
        </div>
    </div>

</th:block>
</body>
</html>
