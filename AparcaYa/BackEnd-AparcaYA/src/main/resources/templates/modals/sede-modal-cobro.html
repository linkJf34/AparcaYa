<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--
    FRAGMENTO: sede-modal-cobro
    Ruta:      templates/modals/sede-modal-cobro.html
    Uso:       <div th:replace="modals/sede-modal-cobro :: modal"></div>

    CSS:       /css/modals/sede-modal-dinamico.css  (v2 — paleta teal)
    Abre:   abrirModalCobro(registroId)  → modal.style.display = 'flex'
    Cierra: cerrarModalCobro()           → modal.style.display = 'none'

    CAMBIOS v2:
      - Header: gradiente teal (igual a Trabajador y resto de Sede)
      - Datos internos dentro de .sede-modal-dinamico-card (#f0fdfa)
      - Total a cobrar con borde superior #ccfbf1
      - Select de método de pago con focus teal
      - Botón cerrar es <button> (accesibilidad)
      - Sin estilos inline. Sin JS embebido.
-->
<body>
<th:block th:fragment="modal">

    <div id="cobroModal"
         class="sede-modal-dinamico"
         role="dialog"
         aria-modal="true"
         aria-labelledby="cobroModalTitulo"
         aria-hidden="true">

        <div class="sede-modal-dinamico-content sede-modal-dinamico-content--cobro">

            <!-- HEADER -->
            <div class="sede-modal-dinamico-header">
                <h2 id="cobroModalTitulo">💰 Procesar Cobro</h2>
                <button type="button"
                        class="sede-modal-dinamico-close"
                        onclick="cerrarModalCobro()"
                        aria-label="Cerrar modal">
                    <svg xmlns="http://www.w3.org/2000/svg"
                         fill="none" viewBox="0 0 24 24"
                         stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- BODY -->
            <div class="sede-modal-dinamico-body">

                <!-- Tarjeta de datos del cobro -->
                <div class="sede-modal-dinamico-card">

                    <div class="sede-modal-cobro-row">
                        <strong>Cliente:</strong>
                        <span id="cobroCliente">—</span>
                    </div>

                    <div class="sede-modal-cobro-row">
                        <strong>Placa:</strong>
                        <span id="cobroPlaca"
                              style="font-weight:700;color:#0f766e;">—</span>
                    </div>

                    <div class="sede-modal-cobro-row">
                        <strong>Tiempo total:</strong>
                        <span id="cobroTiempo"
                              style="font-family:'Courier New',monospace;
                                     font-weight:700;color:#0f766e;">—</span>
                    </div>

                    <!-- Total — actualizado por JS -->
                    <div class="sede-modal-cobro-total">
                        <strong>Total a cobrar:</strong>
                        <span class="sede-modal-cobro-precio">
                            $<span id="cobroPrecio">0</span>
                        </span>
                    </div>

                </div>

                <!--
                    JS inyecta las opciones de tarifa aquí.
                    SedeD.js usa innerHTML con clases:
                      .sede-modal-cobro-selector
                      .sede-modal-cobro-opcion  (label)
                    Ver función abrirModalCobro() en SedeD.js
                -->
                <div id="tarifaSelectorContainer"></div>

                <!-- Método de pago -->
                <div class="sede-modal-cobro-metodo">
                    <label for="metodoPago" class="sede-modal-cobro-label">
                        Método de Pago
                    </label>
                    <select id="metodoPago" class="sede-modal-cobro-select">
                        <option value="EFECTIVO">💵 Efectivo</option>
                        <option value="TARJETA">💳 Tarjeta</option>
                        <option value="TRANSFERENCIA">📱 Transferencia</option>
                    </select>
                </div>

                <!-- Acciones -->
                <div class="sede-modal-dinamico-actions">
                    <button type="button"
                            class="sede-btn-secondary"
                            onclick="cerrarModalCobro()">
                        Cancelar
                    </button>
                    <button type="button"
                            class="sede-btn-primary"
                            onclick="procesarCobro()">
                        Confirmar Cobro
                    </button>
                </div>

            </div><!-- /body -->
        </div><!-- /content -->
    </div><!-- /overlay -->

</th:block>
</body>
</html>
