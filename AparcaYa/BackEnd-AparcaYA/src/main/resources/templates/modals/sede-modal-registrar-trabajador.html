<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--
    FRAGMENTO: sede-modal-registrar-trabajador
    Uso: <div th:replace="modals/sede-modal-registrar-trabajador :: modal"></div>
    Abre:   openRegistrarTrabajadorModal()
    Cierra: closeRegistrarTrabajadorModal()
    Lógica: SedeD.js — SIN CAMBIOS
    CSS:    sede-modal-dinamico.css (sección TRABAJADOR al final)
-->
<body>
<th:block th:fragment="modal">

    <div id="registrarTrabajadorModal"
         class="sede-modal"
         role="dialog"
         aria-modal="true"
         aria-labelledby="modalTrabajadorTitulo"
         aria-hidden="true">

        <div class="sede-modal-box" style="max-width:520px;">

            <!-- ── Encabezado ── -->
            <div class="rt-header">
                <div class="rt-header-icon">
                    <!-- Lucide: user-plus -->
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                         viewBox="0 0 24 24" stroke="white"
                         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <line x1="19" x2="19" y1="8" y2="14"/>
                        <line x1="22" x2="16" y1="11" y2="11"/>
                    </svg>
                </div>
                <div>
                    <h3 id="modalTrabajadorTitulo">Registrar Trabajador</h3>
                    <p class="rt-header-sub">Crea una cuenta de operario para tu sede</p>
                </div>
            </div>

            <!-- ── Banda: Datos personales ── -->
            <div class="rt-section-band">
                <!-- Lucide: user -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                Datos Personales
            </div>

            <!-- Nombre -->
            <label for="trabajadorNombre" class="rt-label">
                <!-- Lucide: pencil-line -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20h9"/>
                    <path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"/>
                </svg>
                Nombre completo
            </label>
            <input type="text" id="trabajadorNombre"
                   class="rt-input"
                   placeholder="Ej: Juan Pérez"
                   autocomplete="name" maxlength="100"/>

            <!-- Grilla 2 col: Correo + Teléfono -->
            <div class="rt-grid2">
                <div>
                    <label for="trabajadorCorreo" class="rt-label">
                        <!-- Lucide: mail -->
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                             stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <rect width="20" height="16" x="2" y="4" rx="2"/>
                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                        </svg>
                        Correo electrónico
                    </label>
                    <input type="email" id="trabajadorCorreo"
                           class="rt-input"
                           placeholder="juan@ejemplo.com"
                           autocomplete="email"/>
                </div>
                <div>
                    <label for="trabajadorTelefono" class="rt-label">
                        <!-- Lucide: phone -->
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                             stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.99 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.9 1.17h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 8.91a16 16 0 0 0 5.99 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
                        </svg>
                        Teléfono
                    </label>
                    <input type="tel" id="trabajadorTelefono"
                           class="rt-input"
                           placeholder="3001234567"
                           autocomplete="tel"/>
                </div>
            </div>

            <!-- Cédula -->
            <label for="trabajadorCedula" class="rt-label">
                <!-- Lucide: id-card -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <rect width="20" height="14" x="2" y="5" rx="2"/>
                    <circle cx="9" cy="12" r="2"/>
                    <path d="M15 9h2"/><path d="M15 12h2"/><path d="M13 15H7"/>
                </svg>
                Cédula
            </label>
            <input type="text" id="trabajadorCedula"
                   class="rt-input"
                   placeholder="1234567890"
                   autocomplete="off"/>

            <!-- ── Banda: Acceso ── -->
            <div class="rt-section-band" style="margin-top:1.125rem;">
                <!-- Lucide: lock -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                Acceso al Sistema
            </div>

            <!-- Contraseña — mismo id, mismo tipo, misma lógica -->
            <label for="trabajadorContrasena" class="rt-label">
                <!-- Lucide: key-round -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/>
                    <circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/>
                </svg>
                Contraseña
            </label>
            <input type="password" id="trabajadorContrasena"
                   class="rt-input"
                   placeholder="Mínimo 8 caracteres"
                   autocomplete="new-password"/>

            <!-- Badge informativo -->
            <div class="rt-info-badge">
                <!-- Lucide: info -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 16v-4"/><path d="M12 8h.01"/>
                </svg>
                El trabajador iniciará sesión con este correo. Su rol será
                <strong>Operario</strong> y quedará asignado a tu sede.
            </div>

            <!-- ── Acciones — onclick idénticos al original ── -->
            <div class="sede-modal-action rt-actions">
                <button class="sede-btn-outline"
                        onclick="closeRegistrarTrabajadorModal()"
                        type="button">
                    <!-- Lucide: x -->
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                         stroke="currentColor" stroke-width="2.5"
                         stroke-linecap="round" stroke-linejoin="round"
                         style="width:15px;height:15px;">
                        <path d="M18 6 6 18M6 6l12 12"/>
                    </svg>
                    Cancelar
                </button>
                <button class="sede-btn-primary"
                        onclick="registrarTrabajador()"
                        type="button">
                    <!-- Lucide: user-check -->
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                         stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round"
                         style="width:16px;height:16px;">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <polyline points="16 11 18 13 22 9"/>
                    </svg>
                    Registrar Trabajador
                </button>
            </div>

        </div>
    </div>

</th:block>
</body>
</html>
