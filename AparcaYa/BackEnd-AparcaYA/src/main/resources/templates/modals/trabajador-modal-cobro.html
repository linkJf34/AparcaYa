<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--
    FRAGMENTO: trabajador-modal-cobro
    Cambio aplicado: emojis del select metodoPago → texto limpio
-->
<body>
<th:block th:fragment="modal">

    <div id="cobroModal"
         class="trab-modal-overlay"
         role="dialog"
         aria-modal="true"
         aria-labelledby="cobroModalTitulo"
         aria-hidden="true">

        <div class="trab-modal-box trab-modal-box--cobro">

            <!-- CABECERA -->
            <div class="trab-modal-header">
                <div class="trab-modal-header-left">
                    <div class="trab-modal-icon">
                        <!-- Lucide: banknote -->
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                             viewBox="0 0 24 24" stroke="white"
                             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="20" height="12" x="2" y="6" rx="2"/>
                            <circle cx="12" cy="12" r="2"/>
                            <path d="M6 12h.01M18 12h.01"/>
                        </svg>
                    </div>
                    <div>
                        <h3 id="cobroModalTitulo" class="trab-modal-title">Procesar Cobro</h3>
                        <p class="trab-modal-subtitle">Seleccioná la tarifa y el método de pago</p>
                    </div>
                </div>
                <button type="button"
                        class="trab-modal-close"
                        onclick="cerrarModalCobro()"
                        aria-label="Cerrar modal">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                         viewBox="0 0 24 24" stroke="currentColor"
                         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6 6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- CUERPO -->
            <div class="trab-modal-body">

                <div class="trab-modal-card">

                    <div class="trab-modal-row">
                        <strong>
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                                 viewBox="0 0 24 24" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                 style="width:13px;height:13px;display:inline;vertical-align:middle;margin-right:.25rem;color:#0d9488;">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                            Cliente:
                        </strong>
                        <span id="cobroCliente">—</span>
                    </div>

                    <div class="trab-modal-row">
                        <strong>
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                                 viewBox="0 0 24 24" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                 style="width:13px;height:13px;display:inline;vertical-align:middle;margin-right:.25rem;color:#0d9488;">
                                <rect width="18" height="18" x="3" y="3" rx="2"/>
                                <path d="M9 17V7h4a3 3 0 0 1 0 6H9"/>
                            </svg>
                            Placa:
                        </strong>
                        <span id="cobroPlaca" class="trab-modal-value--accent">—</span>
                    </div>

                    <div class="trab-modal-row">
                        <strong>
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                                 viewBox="0 0 24 24" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                 style="width:13px;height:13px;display:inline;vertical-align:middle;margin-right:.25rem;color:#0d9488;">
                                <line x1="10" x2="14" y1="2" y2="2"/>
                                <line x1="12" x2="15" y1="14" y2="11"/>
                                <circle cx="12" cy="14" r="8"/>
                            </svg>
                            Tiempo total:
                        </strong>
                        <span id="cobroTiempo" class="trab-modal-value--mono">—</span>
                    </div>

                    <div class="trab-modal-total-row">
                        <strong>
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                                 viewBox="0 0 24 24" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                 style="width:14px;height:14px;display:inline;vertical-align:middle;margin-right:.3rem;color:#059669;">
                                <circle cx="12" cy="12" r="10"/>
                                <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/>
                                <path d="M12 18V6"/>
                            </svg>
                            Total a cobrar:
                        </strong>
                        <span class="trab-modal-total-valor">
                            $<span id="cobroPrecio">0</span>
                        </span>
                    </div>

                </div>

                <div id="tarifaSelectorContainer"></div>

                <!-- Método de pago — CAMBIO: emojis eliminados de las opciones -->
                <div class="trab-modal-metodo-pago">
                    <label for="metodoPago">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                             viewBox="0 0 24 24" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                             style="width:14px;height:14px;display:inline;vertical-align:middle;margin-right:.3rem;color:#0d9488;">
                            <rect width="20" height="14" x="2" y="5" rx="2"/>
                            <line x1="2" x2="22" y1="10" y2="10"/>
                        </svg>
                        Método de Pago
                    </label>
                    <select id="metodoPago">
                        <option value="EFECTIVO">Efectivo</option>
                        <option value="TARJETA">Tarjeta</option>
                        <option value="TRANSFERENCIA">Transferencia</option>
                    </select>
                </div>

                <div class="trab-modal-actions">
                    <button type="button"
                            class="sede-btn-secondary"
                            onclick="cerrarModalCobro()">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                             viewBox="0 0 24 24" stroke="currentColor"
                             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                             style="width:14px;height:14px;">
                            <path d="M18 6 6 18M6 6l12 12"/>
                        </svg>
                        Cancelar
                    </button>
                    <button type="button"
                            class="sede-btn-primary"
                            onclick="procesarCobro()">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                             viewBox="0 0 24 24" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                             style="width:15px;height:15px;">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                            <polyline points="22 4 12 14.01 9 11.01"/>
                        </svg>
                        Confirmar Cobro
                    </button>
                </div>

            </div>
        </div>
    </div>

</th:block>
</body>
</html>
