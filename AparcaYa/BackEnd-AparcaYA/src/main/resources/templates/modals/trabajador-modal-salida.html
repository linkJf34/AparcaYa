<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--
    FRAGMENTO: trabajador-modal-salida
    Ruta:      templates/modals/trabajador-modal-salida.html
    Uso:       <div th:replace="modals/trabajador-modal-salida :: modal"></div>
    CSS:       /css/modals/trabajador-modal.css
    Abre:   abrirModalSalida(registroId)  → añade clase .open
    Cierra: cerrarModalSalida()           → quita clase .open
    Lógica: TrabajadorD.js — SIN CAMBIOS
-->
<body>
<th:block th:fragment="modal">

    <div id="salidaModal"
         class="trab-modal-overlay"
         role="dialog"
         aria-modal="true"
         aria-labelledby="salidaModalTitulo"
         aria-hidden="true">

        <div class="trab-modal-box trab-modal-box--salida">

            <!-- CABECERA -->
            <div class="trab-modal-header">
                <div class="trab-modal-header-left">
                    <div class="trab-modal-icon">
                        <!-- Lucide: log-out -->
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                             viewBox="0 0 24 24" stroke="white"
                             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                            <polyline points="16 17 21 12 16 7"/>
                            <line x1="21" x2="9" y1="12" y2="12"/>
                        </svg>
                    </div>
                    <div>
                        <h3 id="salidaModalTitulo" class="trab-modal-title">Registrar Salida</h3>
                        <p class="trab-modal-subtitle">Confirma los datos antes de continuar</p>
                    </div>
                </div>
                <button type="button"
                        class="trab-modal-close"
                        onclick="cerrarModalSalida()"
                        aria-label="Cerrar modal">
                    <!-- Lucide: x -->
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                         viewBox="0 0 24 24" stroke="currentColor"
                         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6 6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- CUERPO -->
            <div class="trab-modal-body">

                <div class="trab-modal-card">

                    <div class="trab-modal-row">
                        <strong>
                            <!-- Lucide: square-parking -->
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                                 viewBox="0 0 24 24" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                 style="width:13px;height:13px;display:inline;vertical-align:middle;margin-right:.25rem;color:#0d9488;">
                                <rect width="18" height="18" x="3" y="3" rx="2"/>
                                <path d="M9 17V7h4a3 3 0 0 1 0 6H9"/>
                            </svg>
                            Placa:
                        </strong>
                        <span id="salidaPlaca" class="trab-modal-value--accent">—</span>
                    </div>

                    <div class="trab-modal-row">
                        <strong>
                            <!-- Lucide: user -->
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                                 viewBox="0 0 24 24" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                 style="width:13px;height:13px;display:inline;vertical-align:middle;margin-right:.25rem;color:#0d9488;">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                            Cliente:
                        </strong>
                        <span id="salidaCliente">—</span>
                    </div>

                    <div class="trab-modal-row">
                        <strong>
                            <!-- Lucide: calendar -->
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                                 viewBox="0 0 24 24" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                 style="width:13px;height:13px;display:inline;vertical-align:middle;margin-right:.25rem;color:#0d9488;">
                                <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/>
                                <line x1="16" x2="16" y1="2" y2="6"/>
                                <line x1="8"  x2="8"  y1="2" y2="6"/>
                                <line x1="3"  x2="21" y1="10" y2="10"/>
                            </svg>
                            Hora Entrada:
                        </strong>
                        <span id="salidaHoraEntrada">—</span>
                    </div>

                    <div class="trab-modal-row">
                        <strong>
                            <!-- Lucide: timer -->
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                                 viewBox="0 0 24 24" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                 style="width:13px;height:13px;display:inline;vertical-align:middle;margin-right:.25rem;color:#0d9488;">
                                <line x1="10" x2="14" y1="2" y2="2"/>
                                <line x1="12" x2="15" y1="14" y2="11"/>
                                <circle cx="12" cy="14" r="8"/>
                            </svg>
                            Tiempo:
                        </strong>
                        <span id="salidaTiempo" class="trab-modal-value--mono">—</span>
                    </div>

                    <!-- JS inyecta cobro estimado aquí — sin cambios -->
                    <div id="salidaCobroEstimado" class="trab-modal-cobro-estimado"></div>

                </div>

                <!-- Acciones — onclick idénticos al original -->
                <div class="trab-modal-actions">
                    <button type="button"
                            class="sede-btn-secondary"
                            onclick="cerrarModalSalida()">
                        <!-- Lucide: x -->
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                             viewBox="0 0 24 24" stroke="currentColor"
                             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                             style="width:14px;height:14px;">
                            <path d="M18 6 6 18M6 6l12 12"/>
                        </svg>
                        Cancelar
                    </button>
                    <button type="button"
                            class="sede-btn-success"
                            onclick="confirmarSalida()">
                        <!-- Lucide: log-out -->
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                             viewBox="0 0 24 24" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                             style="width:15px;height:15px;">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                            <polyline points="16 17 21 12 16 7"/>
                            <line x1="21" x2="9" y1="12" y2="12"/>
                        </svg>
                        Confirmar Salida
                    </button>
                </div>

            </div>
        </div>
    </div>

</th:block>
</body>
</html>
