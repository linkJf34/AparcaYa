<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--
    FRAGMENTO: trabajador-modal-salida
    Ruta:      templates/modals/trabajador-modal-salida.html
    Uso:       <div th:replace="modals/trabajador-modal-salida :: modal"></div>

    Tipo:      DIV overlay con clase .trab-modal-overlay
    CSS:       /css/modals/trabajador-modal.css

    Abre:   abrirModalSalida(registroId)  → añade clase .open al overlay
    Cierra: cerrarModalSalida()           → quita clase .open

    Diseño:    colores teal exactos del diseño original embebido
               en DashboardTrabajador.html (verde #0f766e, fondo #f0fdfa)

    Sin JS embebido. Sin estilos inline.
-->
<body>
<th:block th:fragment="modal">

    <div id="salidaModal"
         class="trab-modal-overlay"
         role="dialog"
         aria-modal="true"
         aria-labelledby="salidaModalTitulo"
         aria-hidden="true">

        <div class="trab-modal-box trab-modal-box--salida">

            <!-- CABECERA -->
            <div class="trab-modal-header">
                <h3 id="salidaModalTitulo">Registrar Salida</h3>
                <button type="button"
                        class="trab-modal-close"
                        onclick="cerrarModalSalida()"
                        aria-label="Cerrar modal">
                    <svg xmlns="http://www.w3.org/2000/svg"
                         fill="none" viewBox="0 0 24 24"
                         stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- CUERPO -->
            <div class="trab-modal-body">

                <!-- Tarjeta de datos del vehículo -->
                <div class="trab-modal-card">

                    <div class="trab-modal-row">
                        <strong>Placa:</strong>
                        <span id="salidaPlaca" class="trab-modal-value--accent">—</span>
                    </div>

                    <div class="trab-modal-row">
                        <strong>Cliente:</strong>
                        <span id="salidaCliente">—</span>
                    </div>

                    <div class="trab-modal-row">
                        <strong>Hora Entrada:</strong>
                        <span id="salidaHoraEntrada">—</span>
                    </div>

                    <div class="trab-modal-row">
                        <strong>Tiempo:</strong>
                        <span id="salidaTiempo" class="trab-modal-value--mono">—</span>
                    </div>

                    <!--
                        JS inyecta aquí el cobro estimado (plena + minuto).
                        TrabajadorD.js usa innerHTML con clases:
                          .trab-modal-row
                          .trab-modal-cobro-estimado-row--minuto
                        Ver función abrirModalSalida() en TrabajadorD.js
                    -->
                    <div id="salidaCobroEstimado" class="trab-modal-cobro-estimado"></div>

                </div>

                <!-- Acciones -->
                <div class="trab-modal-actions">
                    <button type="button"
                            class="sede-btn-secondary"
                            onclick="cerrarModalSalida()">
                        Cancelar
                    </button>
                    <button type="button"
                            class="sede-btn-success"
                            onclick="confirmarSalida()">
                        <svg xmlns="http://www.w3.org/2000/svg"
                             style="width:1rem;height:1rem;"
                             fill="none" viewBox="0 0 24 24"
                             stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0
                                     01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                        </svg>
                        Confirmar Salida
                    </button>
                </div>

            </div><!-- /trab-modal-body -->
        </div><!-- /trab-modal-box -->
    </div><!-- /trab-modal-overlay -->

</th:block>
</body>
</html>
