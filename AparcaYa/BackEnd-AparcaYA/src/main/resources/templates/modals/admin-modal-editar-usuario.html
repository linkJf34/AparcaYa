<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--
    FRAGMENTO: admin-modal-editar-usuario
    Uso: <div th:replace="modals/admin-modal-editar-usuario :: modal"></div>
    Abre:   document.getElementById('modal_editar_usuario').showModal()  [o función JS]
    Cierra: cerrarModalEdicion()
    CSS:    admin-modal-dinamico.css
    Lógica: adminD.js — SIN CAMBIOS (IDs idénticos al original)
-->
<body>
<th:block th:fragment="modal">

    <div id="modal_editar_usuario"
         class="adm-modal-overlay"
         role="dialog"
         aria-labelledby="modal-usuario-title"
         aria-modal="true"
         aria-hidden="true">

        <div class="adm-modal-box">

            <!-- Cabecera -->
            <div class="adm-modal-header">
                <div class="adm-modal-header-left">
                    <div class="adm-modal-icon">
                        <!-- Lucide: user-pen -->
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                             viewBox="0 0 24 24" stroke="white"
                             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M11.5 15H7a4 4 0 0 0-4 4v2"/>
                            <path d="M21.378 16.626a1 1 0 0 0-3.004-3.004l-4.01 4.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/>
                            <circle cx="10" cy="7" r="4"/>
                        </svg>
                    </div>
                    <div>
                        <h3 id="modal-usuario-title" class="adm-modal-title">Editar Usuario</h3>
                        <p class="adm-modal-subtitle">Actualiza la información del usuario</p>
                    </div>
                </div>
                <button onclick="cerrarModalEdicion()"
                        class="adm-modal-close"
                        aria-label="Cerrar modal"
                        type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                         viewBox="0 0 24 24" stroke="currentColor"
                         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6 6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- Cuerpo -->
            <div class="adm-modal-body">
                <form onsubmit="event.preventDefault(); guardarEdicion();">
                    <input type="hidden" id="edit_usuario_id"/>

                    <!-- Nombre + Email en grilla -->
                    <div class="adm-grid2">
                        <div>
                            <label for="edit_nombre" class="adm-label">
                                <!-- Lucide: pencil-line -->
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                     stroke="currentColor" stroke-width="2"
                                     stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 20h9"/>
                                    <path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"/>
                                </svg>
                                Nombre Completo <span class="adm-required">*</span>
                            </label>
                            <input type="text" id="edit_nombre"
                                   class="adm-input"
                                   placeholder="Ej: Juan Pérez García" required/>
                            <span class="adm-err" id="err-edit-nombre"></span>
                        </div>
                        <div>
                            <label for="edit_email" class="adm-label">
                                <!-- Lucide: mail -->
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                     stroke="currentColor" stroke-width="2"
                                     stroke-linecap="round" stroke-linejoin="round">
                                    <rect width="20" height="16" x="2" y="4" rx="2"/>
                                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                                </svg>
                                Correo Electrónico <span class="adm-required">*</span>
                            </label>
                            <input type="email" id="edit_email"
                                   class="adm-input"
                                   placeholder="ejemplo@correo.com" required/>
                            <span class="adm-err" id="err-edit-email"></span>
                        </div>
                    </div>

                    <!-- Teléfono -->
                    <label for="edit_telefono" class="adm-label">
                        <!-- Lucide: phone -->
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                             stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.99 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.9 1.17h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 8.91a16 16 0 0 0 5.99 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
                        </svg>
                        Teléfono
                    </label>
                    <input type="tel" id="edit_telefono"
                           class="adm-input"
                           placeholder="Ej: 3001234567"/>
                    <span class="adm-err" id="err-edit-telefono"></span>

                    <!-- Rol + Estado en grilla -->
                    <div class="adm-grid2">
                        <div>
                            <label for="edit_rol" class="adm-label">
                                <!-- Lucide: shield-check -->
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                     stroke="currentColor" stroke-width="2"
                                     stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
                                    <path d="m9 12 2 2 4-4"/>
                                </svg>
                                Rol <span class="adm-required">*</span>
                            </label>
                            <select id="edit_rol" class="adm-select" required>
                                <option value="ADMIN">Administrador</option>
                                <option value="ADMINISTRADOR_SEDE">Admin de Sede</option>
                                <option value="OPERARIO">Operario</option>
                                <option value="CLIENTE">Cliente</option>
                            </select>
                        </div>
                        <div>
                            <label for="edit_estado" class="adm-label">
                                <!-- Lucide: toggle-right -->
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                     stroke="currentColor" stroke-width="2"
                                     stroke-linecap="round" stroke-linejoin="round">
                                    <rect width="20" height="12" x="2" y="6" rx="6"/>
                                    <circle cx="16" cy="12" r="2"/>
                                </svg>
                                Estado
                            </label>
                            <select id="edit_estado" class="adm-select">
                                <option value="ACTIVO">Activo</option>
                                <option value="INACTIVO">Inactivo</option>
                            </select>
                        </div>
                    </div>

                    <!-- Badge informativo -->
                    <div class="adm-info-badge">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                             stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M12 16v-4"/><path d="M12 8h.01"/>
                        </svg>
                        Los campos marcados con <strong>*</strong> son obligatorios.
                    </div>

                    <!-- Acciones — onclick idénticos al original -->
                    <div class="adm-modal-actions">
                        <button type="button"
                                onclick="cerrarModalEdicion()"
                                class="adm-btn-outline">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                 stroke="currentColor" stroke-width="2.5"
                                 stroke-linecap="round" stroke-linejoin="round"
                                 style="width:14px;height:14px;">
                                <path d="M18 6 6 18M6 6l12 12"/>
                            </svg>
                            Cancelar
                        </button>
                        <button type="submit" class="adm-btn-primary">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                 stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round"
                                 style="width:15px;height:15px;">
                                <path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>
                                <path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/>
                                <path d="M7 3v4a1 1 0 0 0 1 1h7"/>
                            </svg>
                            Guardar Cambios
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>

</th:block>
</body>
</html>
