<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--
    FRAGMENTO: admin-modal-editar-usuario
    Uso en dashboard: <div th:replace="modals/admin-modal-editar-usuario :: modal"></div>
    Tipo: DaisyUI <dialog> — API nativa showModal() / close()
    Abre con: document.getElementById('modal_editar_usuario').showModal()
    Cierra con: cerrarModalEdicion()
-->
<body>
<th:block th:fragment="modal">

    <dialog id="modal_editar_usuario"
            class="modal"
            aria-labelledby="modal-usuario-title">

        <div class="modal-box w-11/12 max-w-3xl">

            <!-- Encabezado -->
            <div class="flex items-center justify-between mb-6 pb-4 border-b border-gray-200">
                <div class="flex items-center gap-3">
                    <div class="bg-primary/10 p-3 rounded-lg">
                        <svg xmlns="http://www.w3.org/2000/svg"
                             class="h-6 w-6 text-primary"
                             fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5
                                  m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                        </svg>
                    </div>
                    <div>
                        <h3 id="modal-usuario-title"
                            class="font-bold text-2xl text-gray-800">
                            Editar Usuario
                        </h3>
                        <p class="text-sm text-gray-500">
                            Actualiza la información del usuario
                        </p>
                    </div>
                </div>

                <button onclick="cerrarModalEdicion()"
                        class="btn btn-sm btn-circle btn-ghost"
                        aria-label="Cerrar modal"
                        type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5"
                         fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- Formulario -->
            <form onsubmit="event.preventDefault(); guardarEdicion();">
                <input type="hidden" id="edit_usuario_id">

                <div class="space-y-4">

                    <!-- Nombre y Email -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="form-control">
                            <label class="label">
                                <span class="label-text font-semibold text-gray-700">
                                    <span class="text-error">*</span> Nombre Completo
                                </span>
                            </label>
                            <input type="text"
                                   id="edit_nombre"
                                   placeholder="Ej: Juan Pérez García"
                                   class="input input-bordered w-full"
                                   required>
                        </div>
                        <div class="form-control">
                            <label class="label">
                                <span class="label-text font-semibold text-gray-700">
                                    <span class="text-error">*</span> Correo Electrónico
                                </span>
                            </label>
                            <input type="email"
                                   id="edit_email"
                                   placeholder="ejemplo@correo.com"
                                   class="input input-bordered w-full"
                                   required>
                        </div>
                    </div>

                    <!-- Teléfono -->
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-semibold text-gray-700">
                                Teléfono
                            </span>
                        </label>
                        <input type="tel"
                               id="edit_telefono"
                               placeholder="Ej: 3001234567"
                               class="input input-bordered w-full">
                    </div>

                    <!-- Rol y Estado -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="form-control">
                            <label class="label">
                                <span class="label-text font-semibold text-gray-700">
                                    <span class="text-error">*</span> Rol
                                </span>
                            </label>
                            <select id="edit_rol"
                                    class="select select-bordered w-full"
                                    required>
                                <option value="ADMIN">Administrador</option>
                                <option value="ADMINISTRADOR_SEDE">Admin de Sede</option>
                                <option value="OPERARIO">Operario</option>
                                <option value="CLIENTE">Cliente</option>
                            </select>
                        </div>
                        <div class="form-control">
                            <label class="label">
                                <span class="label-text font-semibold text-gray-700">
                                    Estado
                                </span>
                            </label>
                            <select id="edit_estado"
                                    class="select select-bordered w-full">
                                <option value="ACTIVO">Activo</option>
                                <option value="INACTIVO">Inactivo</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Nota informativa -->
                <div class="alert alert-info mt-6 shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                         class="stroke-current shrink-0 w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <span>
                        Los campos con <span class="text-error font-bold">*</span> son obligatorios
                    </span>
                </div>

                <!-- Acciones -->
                <div class="modal-action mt-6 pt-4 border-t border-gray-200">
                    <button type="button"
                            onclick="cerrarModalEdicion()"
                            class="btn btn-ghost">
                        Cancelar
                    </button>
                    <button type="submit" class="btn btn-primary">
                        Guardar Cambios
                    </button>
                </div>
            </form>
        </div>

        <!-- Backdrop DaisyUI — clic fuera cierra -->
        <form method="dialog" class="modal-backdrop">
            <button>close</button>
        </form>
    </dialog>

</th:block>
</body>
</html>
