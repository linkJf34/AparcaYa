<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--
    FRAGMENTO: admin-modal-detalle-sede
    Uso: <div th:replace="modals/admin-modal-detalle-sede :: modal"></div>
    Abre:   mostrarDetallesSede(sedeId)
    Cierra: cerrarModalSede()
    CSS:    admin-modal-dinamico.css
    Lógica: AdminD.js — JS solo asigna valores, sin innerHTML
-->
<body>
<th:block th:fragment="modal">

    <div id="modalSede"
         class="adm-modal-overlay"
         role="dialog"
         aria-labelledby="modalSedeTitle"
         aria-modal="true"
         aria-hidden="true">

        <div class="adm-modal-box">

            <!-- Cabecera -->
            <div class="adm-modal-header">
                <div class="adm-modal-header-left">
                    <div class="adm-modal-icon">
                        <!-- Lucide: building-2 -->
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                             viewBox="0 0 24 24" stroke="white"
                             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/>
                            <path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/>
                            <path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/>
                            <path d="M10 6h4"/><path d="M10 10h4"/>
                            <path d="M10 14h4"/><path d="M10 18h4"/>
                        </svg>
                    </div>
                    <div>
                        <h3 id="modalSedeTitle" class="adm-modal-title">Información de la Sede</h3>
                        <p class="adm-modal-subtitle">Detalle completo del registro</p>
                    </div>
                </div>
                <button class="adm-modal-close"
                        onclick="cerrarModalSede()"
                        aria-label="Cerrar modal"
                        type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                         viewBox="0 0 24 24" stroke="currentColor"
                         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6 6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- Cuerpo con campos fijos -->
            <div class="adm-modal-body" id="modalSedeBody">

                <div class="admin-info-grid">

                    <!-- Estado -->
                    <div class="admin-info-item admin-info-full">
                        <div class="admin-info-label">Estado</div>
                        <div class="admin-info-value">
                            <span id="detalle-sede-estado" class="admin-badge"></span>
                        </div>
                    </div>

                    <!-- NIT -->
                    <div class="admin-info-item">
                        <div class="admin-info-label">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none"
                                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round"
                                 style="display:inline;vertical-align:middle;margin-right:4px;">
                                <rect width="8" height="4" x="8" y="2" rx="1" ry="1"/>
                                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                            </svg>
                            NIT
                        </div>
                        <div class="admin-info-value" id="detalle-sede-nit">—</div>
                    </div>

                    <!-- Capacidad -->
                    <div class="admin-info-item">
                        <div class="admin-info-label">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none"
                                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round"
                                 style="display:inline;vertical-align:middle;margin-right:4px;">
                                <path d="M19 17H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2z"/>
                                <circle cx="7.5" cy="17" r="1.5"/><circle cx="16.5" cy="17" r="1.5"/>
                                <path d="M5 9h14M9 9V7a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>
                            </svg>
                            Capacidad
                        </div>
                        <div class="admin-info-value">
                            <span id="detalle-sede-capacidad">—</span>
                            <span style="font-size:.8rem;color:#94a3b8;margin-left:4px;">vehículos</span>
                        </div>
                    </div>

                    <!-- Localidad -->
                    <div class="admin-info-item">
                        <div class="admin-info-label">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none"
                                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round"
                                 style="display:inline;vertical-align:middle;margin-right:4px;">
                                <path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/>
                                <circle cx="12" cy="10" r="3"/>
                            </svg>
                            Localidad
                        </div>
                        <div class="admin-info-value" id="detalle-sede-localidad">—</div>
                    </div>

                    <!-- Barrio -->
                    <div class="admin-info-item admin-info-full">
                        <div class="admin-info-label">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none"
                                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round"
                                 style="display:inline;vertical-align:middle;margin-right:4px;">
                                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                                <polyline points="9 22 9 12 15 12 15 22"/>
                            </svg>
                            Barrio
                        </div>
                        <div class="admin-info-value" id="detalle-sede-barrio">—</div>
                    </div>

                    <!-- Dirección -->
                    <div class="admin-info-item admin-info-full">
                        <div class="admin-info-label">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none"
                                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round"
                                 style="display:inline;vertical-align:middle;margin-right:4px;">
                                <path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"/>
                                <circle cx="12" cy="10" r="3"/>
                            </svg>
                            Dirección
                        </div>
                        <div class="admin-info-value" id="detalle-sede-direccion">—</div>
                    </div>

                    <!-- Tarifas -->
                    <div class="admin-info-item admin-info-full">
                        <div class="admin-info-label">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none"
                                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round"
                                 style="display:inline;vertical-align:middle;margin-right:4px;">
                                <line x1="12" x2="12" y1="2" y2="22"/>
                                <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                            </svg>
                            Tarifas
                        </div>
                        <div class="admin-info-value admin-modal-sede-tarifas">
                            <strong>Carros:</strong>
                            &nbsp;&nbsp;Hora plena:
                            $<span id="detalle-sede-tarifa-plena-c">—</span> COP
                            &nbsp;&nbsp;Por minuto:
                            $<span id="detalle-sede-tarifa-minuto-c">—</span> COP<br>
                            <strong>Motos:</strong>
                            &nbsp;&nbsp;Hora plena:
                            $<span id="detalle-sede-tarifa-plena-m">—</span> COP
                            &nbsp;&nbsp;Por minuto:
                            $<span id="detalle-sede-tarifa-minuto-m">—</span> COP
                        </div>
                    </div>

                    <!-- Horario -->
                    <div class="admin-info-item admin-info-full">
                        <div class="admin-info-label">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none"
                                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round"
                                 style="display:inline;vertical-align:middle;margin-right:4px;">
                                <circle cx="12" cy="12" r="10"/>
                                <polyline points="12 6 12 12 16 14"/>
                            </svg>
                            Horario
                        </div>
                        <div class="admin-info-value" id="detalle-sede-horario">—</div>
                    </div>

                </div>

                <!-- Acciones -->
                <div class="admin-modal-sede-actions">
                    <button class="adm-btn-outline"
                            id="detalle-sede-btn-editar"
                            type="button">
                        Editar Sede
                    </button>
                    <button class="adm-btn-danger"
                            id="detalle-sede-btn-eliminar"
                            type="button">
                        Eliminar
                    </button>
                </div>

            </div>
        </div>
    </div>

</th:block>
</body>
</html>
