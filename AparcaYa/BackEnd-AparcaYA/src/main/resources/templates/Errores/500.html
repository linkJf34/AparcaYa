<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>500 — Error interno del servidor · AparcaYA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="/css/base/aparca-animations.css">
    <link rel="stylesheet" href="/css/components/aparca-components.css">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #f8fafc; font-family: system-ui, sans-serif; }
        .error-card { background: white; border-radius: 1.25rem; box-shadow: 0 4px 32px rgba(0,0,0,.08);
            padding: 3rem 2.5rem; max-width: 480px; width: 100%; text-align: center; }
        .error-icon-wrap { width: 80px; height: 80px; border-radius: 50%; background: #fef2f2;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.5rem; }
        .error-icon-wrap svg { width: 36px; height: 36px; stroke: #ef4444; }
        .error-code { font-size: 4rem; font-weight: 700; letter-spacing: -.025em;
            color: #991b1b; line-height: 1; margin-bottom: .5rem; }
        .error-title { font-size: 1.25rem; font-weight: 600; color: #1e293b; margin-bottom: .75rem; }
        .error-desc { font-size: .9375rem; color: #64748b; line-height: 1.6; margin-bottom: 2rem; }
        .btn-home { display: inline-flex; align-items: center; gap: .5rem; background: #1e40af;
            color: white; padding: .75rem 1.75rem; border-radius: .625rem; font-weight: 600;
            font-size: .9375rem; text-decoration: none; transition: background .15s; }
        .btn-home:hover { background: #1e3a8a; }
        .btn-home svg { width: 18px; height: 18px; stroke: white; }
        .error-meta { margin-top: 1.5rem; font-size: .8125rem; color: #94a3b8; }
    </style>
</head>
<body>
<div class="error-card">
    <div class="error-icon-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
    </div>
    <div class="error-code">500</div>
    <div class="error-title">Error interno del servidor</div>
    <p class="error-desc">Algo salió mal en el servidor.<br>Nuestro equipo ya fue notificado. Intenta más tarde.</p>
    <a href="/" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Volver al inicio
    </a>
    <p class="error-meta">AparcaYA &mdash; Error 500</p>
</div>
<script>if (typeof lucide !== 'undefined') lucide.createIcons();</script>
</body>
</html>
