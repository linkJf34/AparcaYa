<!DOCTYPE html>
<html lang="es"
      data-theme="light"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inicio de Sesión - Aparca Ya</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css"
          rel="stylesheet" />

    <link rel="stylesheet" href="/css/base/aparca-animations.css" />
    <link rel="stylesheet" href="/css/components/aparca-components.css" />
    <link rel="stylesheet" href="/css/pages/login.css" />
</head>

<body class="bg-gradient-to-br from-blue-50 to-white
             min-h-screen flex items-center justify-center p-6">


<!-- TARJETA DEL FORMULARIO -->
<section class="w-full max-w-md bg-white rounded-lg shadow-lg p-8 animate-fade-in-up"
         aria-label="Formulario de inicio de sesión">

    <header class="flex justify-center mb-6">
        <svg xmlns="http://www.w3.org/2000/svg"
             class="h-16 w-16 text-blue-600"
             fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="1.5"
             aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M4.5 20.118a7.5 7.5 0 0115 0c0-2-3-4.5-7.5-4.5S4.5 18.118 4.5 20.118z" />
        </svg>
    </header>

    <h1 class="text-3xl font-bold text-blue-900 text-center mb-2">
        Inicio de Sesión
    </h1>

    <p class="text-blue-600 text-center mb-8">
        Accede a tu cuenta para gestionar tus reservas y más
    </p>

    <!-- Mensaje de credenciales incorrectas (Spring Security ?error) -->
    <div id="error-msg"
         class="error-message text-center mb-4 hidden"
         role="alert"
         aria-live="polite">
        Correo o contraseña incorrectos.
    </div>


    <!-- FORMULARIO DE LOGIN -->
    <form action="/login" method="post" novalidate
          class="space-y-6" id="login-form">

        <!-- Campo correo -->
        <div>
            <label for="correo"
                   class="block text-sm font-medium text-blue-800">
                Correo electrónico
            </label>
            <input type="email"
                   name="username"
                   id="correo"
                   required
                   autocomplete="email"
                   placeholder="tu@ejemplo.com"
                   class="input input-bordered w-full border-blue-300
                          focus:border-blue-500 focus:ring-blue-500"
                   aria-describedby="correo-error" />
            <div id="correo-error"
                 class="error-message hidden"
                 role="alert"
                 aria-live="polite">
                Por favor ingresa un correo válido.
            </div>
        </div>

        <!-- Campo contraseña -->
        <div class="relative">
            <label for="contrasena"
                   class="block text-sm font-medium text-blue-800">
                Contraseña
            </label>
            <input type="password"
                   name="password"
                   id="contrasena"
                   required
                   autocomplete="current-password"
                   placeholder="••••••••"
                   class="input input-bordered w-full border-blue-300
                          focus:border-blue-500 focus:ring-blue-500 pr-10"
                   aria-describedby="contrasena-error" />

            <svg id="toggle-password"
                 xmlns="http://www.w3.org/2000/svg"
                 class="h-5 w-5 text-blue-600 password-toggle"
                 fill="none" viewBox="0 0 24 24"
                 stroke="currentColor" stroke-width="2"
                 role="button"
                 aria-label="Mostrar u ocultar contraseña"
                 tabindex="0">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943
                      9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943
                      -9.542-7z" />
            </svg>

            <div id="contrasena-error"
                 class="error-message hidden"
                 role="alert"
                 aria-live="polite">
                La contraseña es requerida.
            </div>
        </div>

        <!-- Checkbox términos -->
        <div class="flex items-center">
            <input type="checkbox"
                   id="terms"
                   name="aceptaTerminos"
                   class="checkbox checkbox-primary mr-2"
                   aria-describedby="terms-error" />
            <label for="terms"
                   class="text-sm text-blue-700 select-none cursor-pointer">
                Acepto los términos y condiciones
            </label>
        </div>
        <div id="terms-error"
             class="error-message hidden"
             role="alert"
             aria-live="polite">
        </div>

        <!-- Botón submit -->
        <button type="submit"
                class="btn btn-primary btn-block btn-pulse">
            Iniciar Sesión
        </button>

        <!-- Link recuperar contraseña -->
        <div class="text-center mt-4">
            <a href="#"
               id="forgot-password-link"
               class="link link-primary hover:underline">
                ¿Olvidaste tu contraseña?
            </a>
        </div>

        <div class="divider mt-6 mb-1">O</div>

        <!-- Link crear cuenta -->
        <div class="text-center">
            <a href="/registro"
               class="btn btn-primary w-full">
                Crear cuenta nueva
            </a>
        </div>
    </form>
</section>


<!-- Modal recuperación de contraseña -->
<div th:replace="modals/login-modal-recuperar :: modal"></div>

<!-- ✅ RUTA CORREGIDA: /Script/loginD.js → /js/loginD.js -->
<script src="/js/loginD.js"></script>

</body>
</html>
