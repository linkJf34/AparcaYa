# =====================================================================
# SESIÓN ? 24 horas
# server.servlet.session.timeout acepta sufijo m (minutos) o s (segundos).
# 1440m = 24 horas. Doble cobertura con sessionTimeoutCustomizer en SecurityConfig.
# cookie.max-age en segundos: 86400 = 24 horas.
# http-only: true ? la cookie no es accesible desde JS (protección XSS).
# secure: false en desarrollo (HTTP). Cambiar a true en producción (HTTPS).
# =====================================================================
server.servlet.session.timeout=1440m
server.servlet.session.cookie.max-age=86400
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
# Nombre explícito de la cookie de sesión (coincide con deleteCookies en SecurityConfig)
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.same-site=Lax

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

