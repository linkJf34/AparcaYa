# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy JAR app to Azure Web App - AparcaYa

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Build with Maven (skip tests)
        run: mvn -B -f AparcaYa/BackEnd-AparcaYA/pom.xml clean package -DskipTests

      - name: Pick jar to deploy (exclude original-*.jar)
        id: pickjar
        shell: bash
        run: |
          set -euo pipefail
          JAR_PATH="$(find "${GITHUB_WORKSPACE}/AparcaYa/BackEnd-AparcaYA/target" -maxdepth 1 -type f -name "*.jar" ! -name "original-*.jar" | head -n 1)"
          echo "Selected jar: $JAR_PATH"
          if [ -z "$JAR_PATH" ]; then
            echo "No deployable jar found"
            ls -la "${GITHUB_WORKSPACE}/AparcaYa/BackEnd-AparcaYA/target" || true
            exit 1
          fi
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: ${{ steps.pickjar.outputs.jar_path }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout
  
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DC3D22C7BE474C20B413A43AAFBDEDE8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5FC8A4D93EAB4EC2A0269DC924D1F7D7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_81E5D677C8FA42A98C237DDF46F6F459 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'AparcaYa'
          slot-name: 'Production'
          package: '*.jar'
          
